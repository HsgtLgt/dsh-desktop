<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="screen">
      <div class="logo">DSH</div>
      <h1>DSH Desktop</h1>
      <p class="subtitle">DeepSeek Harness 桌面版 · 钉死运行时</p>

      <div class="status-card">
        <div id="status" class="status-text">正在启动…</div>
        <div id="spinner" class="spinner hidden"></div>
        <div id="detail" class="detail hidden"></div>

        <div id="wizard" class="wizard hidden">
          <p class="wizard-title">需要安装本地运行时</p>
          <p class="wizard-hint">
            将安装便携版 Node.js，并把 DeepSeek Harness
            <strong>钉死</strong>到应用目录。之后启动不再走 npx，升级请用托盘「升级
            DSH」。
          </p>
          <div class="btn-row">
            <button id="btn-install" class="btn primary">一键安装运行时</button>
            <button id="btn-guide" class="btn">打开 Node.js 官网</button>
          </div>
        </div>

        <div id="error" class="error hidden">
          <p id="error-msg" class="error-msg"></p>
          <div class="btn-row">
            <button id="btn-retry" class="btn primary">重试</button>
            <button id="btn-quit" class="btn">退出</button>
          </div>
        </div>
      </div>

      <p class="footer">
        关闭窗口将最小化到托盘。开机自启为静默托盘，失败不会弹致命窗口。
      </p>
    </main>
  </body>
</html>
